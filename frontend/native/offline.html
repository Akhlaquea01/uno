<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Uno</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #101716;
        color: #f6f8f4;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 20px;
      }
      p {
        margin: 0;
        max-width: 360px;
        color: #91a39a;
        font-size: 14px;
      }
      button {
        margin-top: 4px;
        padding: 12px 28px;
        border: 0;
        border-radius: 10px;
        background: #ef3d3d;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach the Uno server</h1>
      <p>
        Check your internet connection. If the server was asleep it can take up to a
        minute to wake.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      // Replaced with the real server URL by native/prepare-offline.mjs at build time.
      var SERVER_URL = '__SERVER_URL__';
      var retry = function () {
        location.replace(SERVER_URL);
      };
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
