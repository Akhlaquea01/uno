name: Build Android APK

# Builds an installable Uno APK on GitHub's runners (they ship the Android SDK).
# Run it from Actions > "Build Android APK" > Run workflow, or push a tag like apk-v1.0.0
# to also publish the APK as a GitHub Release.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: Deployed Uno server URL (defaults to the UNO_SERVER_URL repository variable)
        required: false
        type: string
  push:
    tags:
      - 'apk-v*'

permissions:
  contents: write # only used to attach the APK to a release on tag builds

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url || vars.UNO_SERVER_URL }}
    steps:
      - name: Require the server URL
        run: |
          if [ -z "$CAPACITOR_SERVER_URL" ]; then
            echo "::error::Set the UNO_SERVER_URL repository variable (Settings > Secrets and variables > Actions > Variables) or pass server_url when running the workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Build shared types
        run: npm run build -w shared

      - name: Build web app and sync into the Android project
        run: npm run cap:sync -w frontend

      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk uno.apk

      - uses: actions/upload-artifact@v4
        with:
          name: uno-apk
          path: uno.apk

      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: uno.apk
